<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Latihan TKA Bahasa Indonesia SD</title>
<style>
:root{--bg:#f2f5fa;--card:#fff;--ink:#172033;--muted:#5b6678;--line:#d5dce8;--acc:#2a56a5;--accbg:#e4ecfa;--ok:#17703f;--okbg:#e2f4ea;--bad:#b3261e;--badbg:#fbe7e5;--sheet:#fffbea;--rule:#e8c9c4;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#121722;--card:#1b2230;--ink:#e7ebf3;--muted:#9aa6ba;--line:#323d52;--acc:#8db3f2;--accbg:#22314d;--ok:#6fd49b;--okbg:#17322438;--bad:#ff8f87;--badbg:#3b1d1f;--sheet:#262a1f;--rule:#5b3a3a}}
:root[data-theme="dark"]{--bg:#121722;--card:#1b2230;--ink:#e7ebf3;--muted:#9aa6ba;--line:#323d52;--acc:#8db3f2;--accbg:#22314d;--ok:#6fd49b;--okbg:#173224;--bad:#ff8f87;--badbg:#3b1d1f;--sheet:#262a1f;--rule:#5b3a3a}
html{scroll-padding-top:calc(env(safe-area-inset-top,0px) + 4.5rem);height:100%}
*,*::before,*::after{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);color:var(--ink);font:16px/1.55 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);background:var(--card);z-index:10}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--acc);outline-offset:2px}
.wrap{max-width:1100px;margin:0 auto;padding:0 16px 48px}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:9;background:var(--card);border-bottom:1px solid var(--line);padding:10px 16px}
.bar-in{max-width:1100px;margin:0 auto;display:flex;flex-wrap:wrap;gap:8px 14px;align-items:center}
.bar b{font-size:15px}.prog{flex:1 1 120px;height:8px;background:var(--line);border-radius:8px;overflow:hidden}.prog i{display:block;height:100%;background:var(--acc)}
.chips{display:flex;gap:6px;flex-wrap:wrap;width:100%}
.chip{min-width:38px;height:38px;border:1.5px solid var(--line);background:var(--card);border-radius:8px;font-weight:600}
.chip.done{background:var(--accbg);border-color:var(--acc)}.chip.cur{background:var(--acc);color:var(--card);border-color:var(--acc)}
.btn{min-height:44px;padding:0 18px;border-radius:10px;border:1.5px solid var(--acc);background:var(--card);font-weight:600}
.btn.pri{background:var(--acc);color:var(--bg)}.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:10px;flex-wrap:wrap;align-items:center}
.layout{display:grid;gap:18px;margin-top:18px;grid-template-columns:1fr}
@media(min-width:900px){.layout{grid-template-columns:minmax(0,1.05fr) minmax(0,1fr);align-items:start}.stim{position:sticky;top:calc(env(safe-area-inset-top,0px) + 7.5rem);max-height:calc(100vh - 9rem);overflow:auto}}
.stim{background:var(--sheet);border:1px solid var(--line);border-left:5px double var(--rule);border-radius:6px;padding:18px 20px;font-family:Georgia,"Times New Roman",serif;line-height:1.75}
.stim h2{margin:0 0 2px;font-size:20px;text-align:center}.jenis{margin:0 0 12px;text-align:center;color:var(--muted);font-size:14px;font-family:system-ui,sans-serif}
.stim p,.intro p{margin:0 0 .7em}.stim .ctr{text-align:center;font-weight:700}.stim .rt{text-align:right;margin:0}.stim .ln{text-align:center;margin:0}.stim .gap{height:.9em}
.num{padding-left:1.7em;text-indent:-1.4em;margin:0 0 .35em}.dlg{padding-left:5.2em;text-indent:-5.2em;margin:0 0 .45em}.dlg b{display:inline-block;width:4.6em;text-indent:0;font-weight:600}.note{font-style:italic;font-size:.95em}
.img{border:1px solid var(--line);border-radius:10px;padding:8px;margin:10px 0 14px;background:var(--card);font:14px/1.5 system-ui,sans-serif;overflow:hidden}.img b{display:block;margin:0 0 6px}.img img{display:block;width:100%;height:auto;max-height:260px;object-fit:contain;border-radius:6px;background:#f4f5f6}.img figcaption{margin-top:6px;color:var(--muted);font-size:13px;line-height:1.45}
.soal{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;margin-bottom:16px}
.intro{border-left:3px solid var(--line);padding-left:12px;margin-bottom:10px;font-family:Georgia,serif}.intro .dlg{padding-left:4.2em;text-indent:-4.2em}.intro .dlg b{width:3.6em}
.stem{margin:0 0 8px;font-weight:600}.hint{margin:0 0 8px;color:var(--muted);font-size:14px}.meta{float:right;font-size:12px;color:var(--muted);margin-left:8px}
.opt{display:flex;gap:10px;align-items:flex-start;padding:10px 12px;margin:6px 0;border:1.5px solid var(--line);border-radius:10px;cursor:pointer;min-height:44px}
.opt:has(input:checked){border-color:var(--acc);background:var(--accbg)}.opt input{margin-top:5px;accent-color:var(--acc);width:18px;height:18px;flex:none}.opt.lock{cursor:default}
.opt.ok{border-color:var(--ok);background:var(--okbg)}.opt.bad{border-color:var(--bad);background:var(--badbg)}.tag{margin-left:auto;font-weight:700;white-space:nowrap}
.krow{border:1.5px solid var(--line);border-radius:10px;padding:10px 12px;margin:6px 0}.krow p{margin:0 0 6px}.krow .row{gap:8px}.krow .opt{margin:0;padding:6px 12px;flex:1 1 130px}
.fb{margin-top:10px;padding:10px 12px;border-radius:10px;font-size:15px}.fb.ok{background:var(--okbg);border:1px solid var(--ok)}.fb.bad{background:var(--badbg);border:1px solid var(--bad)}.fb b{display:block;margin-bottom:2px}
.panel{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:18px 20px;margin-top:18px}.panel h1,.panel h2{margin:0 0 8px;line-height:1.25}
.mode{display:block;border:1.5px solid var(--line);border-radius:12px;padding:12px 14px;margin:8px 0;cursor:pointer}.mode:has(input:checked){border-color:var(--acc);background:var(--accbg)}.mode input{margin-right:8px;accent-color:var(--acc)}.mode small{display:block;color:var(--muted);margin-left:26px}
.score{font-size:56px;font-weight:800;line-height:1;color:var(--acc)}table{border-collapse:collapse;width:100%;margin:8px 0}th,td{border-bottom:1px solid var(--line);padding:6px 8px;text-align:left;font-size:15px}
.grid{display:flex;flex-wrap:wrap;gap:6px}.sq{width:44px;height:44px;border-radius:8px;border:1.5px solid var(--line);background:var(--card);font-weight:700}.sq.ok{border-color:var(--ok);background:var(--okbg)}.sq.bad{border-color:var(--bad);background:var(--badbg)}
.foot{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:8px}
@media(prefers-reduced-motion:no-preference){.prog i{transition:width .25s}}
</style>
</head>
<body>
<div id="app"></div>
<script>
const D = [{"no":1,"jenis":"Informasi-Eksposisi","tema":"Lingkungan pesisir","stimulus":[{"t":"p","text":"Hutan mangrove atau hutan bakau tumbuh di pesisir yang tergenang air payau. Akar tumbuhan ini mencuat dari lumpur dan saling menjalin. Bentuk akar itulah yang membuat mangrove dapat berdiri kokoh di tanah berlumpur ketika air pasang datang."},{"t":"p","text":"Mangrove berperan sebagai benteng alami bagi daerah pesisir. Jalinan akarnya meredam kekuatan ombak dan menahan lumpur agar tidak hanyut. Dengan begitu, daratan terhindar dari abrasi, yaitu pengikisan pantai oleh air laut."},{"t":"p","text":"Selain itu, hutan mangrove menjadi tempat berlindung dan berkembang biak bagi ikan, udang, dan kepiting. Di sela-sela akarnya, anak-anak ikan dapat tumbuh dengan aman dari pemangsa. Akibatnya, nelayan di sekitar hutan mangrove sering memperoleh hasil tangkapan yang melimpah."},{"t":"p","text":"Oleh karena itu, hutan mangrove perlu dijaga. Jika mangrove ditebang sembarangan, pantai kehilangan pelindungnya dan hewan laut kehilangan rumahnya."}],"soal":[{"no":1,"level":"L1","tipe":"PG","stem":"Kerangka isi yang sesuai dengan teks tersebut adalah ....","options":["jenis-jenis mangrove → perlindungan pantai → tempat hidup hewan laut → cara menanam mangrove","ciri dan tempat tumbuh → tempat hidup hewan laut → perlindungan pantai → perlunya menjaga mangrove","ciri dan tempat tumbuh → perlindungan pantai → tempat hidup hewan laut → perlunya menjaga mangrove","ciri dan tempat tumbuh → perlindungan pantai → penyebab abrasi → hasil tangkapan nelayan"],"mcma":false,"key":"C","bahas":"Paragraf 1 membahas ciri dan tempat tumbuh, paragraf 2 perlindungan pantai, paragraf 3 tempat hidup hewan laut, dan paragraf 4 ajakan menjaga mangrove. Hanya pilihan C yang urutannya sesuai. B terbalik urutannya; A dan D memuat isi yang tidak menjadi bagian utama teks."},{"no":2,"level":"L2","tipe":"PGK MCMA","stem":"Makna ungkapan benteng alami pada paragraf kedua adalah mangrove ....","options":["melindungi pantai dari terjangan ombak","menghalangi kapal besar masuk ke pelabuhan","menjaga daratan agar tidak terkikis laut"],"mcma":true,"key":"A, C","bahas":"Benteng berfungsi melindungi. Paragraf 2 menyebutkan akar mangrove meredam ombak dan mencegah abrasi, sehingga pilihan A dan C benar. Pilihan B tidak disebutkan dalam teks."},{"no":3,"level":"L3","tipe":"PGK Kategori","stem":"Tentukan kesesuaian pendapat tiap murid dengan isi teks!","intro":[{"t":"p","text":"Teks di atas belum memiliki judul. Tiga murid berdiskusi untuk memilih judul yang cocok."},{"t":"dialog","who":"Dina","text":"Menurutku, judulnya Manfaat Hutan Mangrove. Teks menjelaskan peran mangrove bagi pantai dan hewan laut."},{"t":"dialog","who":"Raka","text":"Aku memilih Cara Menanam Mangrove. Teks menjelaskan langkah-langkah menanam mangrove."},{"t":"dialog","who":"Sari","text":"Kalau aku, Ciri-Ciri Akar Mangrove. Hampir seluruh isi teks membahas bentuk akar."}],"mcma":false,"kategori":{"cols":["Sesuai","Tidak sesuai"],"rows":[["Judul usulan Dina sesuai dengan isi teks.",0],["Alasan yang dikemukakan Raka sesuai dengan isi teks.",1],["Alasan yang dikemukakan Sari sesuai dengan isi teks.",1]]},"key":"","bahas":"Teks membahas peran mangrove bagi pantai dan hewan laut, sehingga judul Dina sesuai. Teks tidak memuat langkah menanam (Raka). Bentuk akar hanya dibahas di paragraf pertama, bukan hampir seluruh teks (Sari)."}]},{"no":2,"jenis":"Fiksi-Drama Anak","tema":"Kejujuran di sekolah","stimulus":[{"t":"title","text":"Kotak Kejujuran"},{"t":"note","text":"Tempat: kantin kejujuran di sekolah, saat jam istirahat. Tokoh: Arif, Bayu, dan Citra."},{"t":"dialog","who":"Citra","text":"(menghitung uang di dalam kotak) Hmm, uangnya kurang dua ribu rupiah. Padahal catatan penjualan sudah benar."},{"t":"dialog","who":"Bayu","text":"Mungkin ada yang lupa membayar."},{"t":"dialog","who":"Arif","text":"(menunduk, suaranya pelan) Sebenarnya, kemarin aku mengambil dua bungkus keripik. Uangku hanya cukup untuk satu bungkus. Kukira tidak ada yang melihat."},{"t":"dialog","who":"Citra","text":"Mengapa kamu tidak bilang saja kalau uangmu kurang?"},{"t":"dialog","who":"Arif","text":"Aku malu. Aku takut dianggap tukang bohong."},{"t":"dialog","who":"Bayu","text":"Sekarang kamu sudah berani mengakuinya. Itu lebih baik daripada menyimpannya sendiri."},{"t":"dialog","who":"Citra","text":"Ayo, kita temui Bu Wati. Beliau pasti menerima pengakuanmu dengan lapang dada."},{"t":"dialog","who":"Arif","text":"(mengeluarkan uang dua ribu rupiah) Baiklah. Aku akan membayar kekuranganku, lalu meminta maaf."},{"t":"dialog","who":"Bayu","text":"Aku temani, Rif."}],"soal":[{"no":4,"level":"L2","tipe":"PG","stem":"Ungkapan lapang dada pada ucapan Citra menunjukkan bahwa Bu Wati akan ....","options":["memarahi Arif di depan murid lain","bersikap tenang dan tidak marah kepada Arif","melaporkan Arif kepada orang tuanya","menghukum Arif agar jera"],"mcma":false,"key":"B","bahas":"Lapang dada berarti berhati luas, sabar, dan tidak mudah marah. Citra yakin Bu Wati akan menanggapi pengakuan Arif dengan tenang."},{"no":5,"level":"L2","tipe":"PGK MCMA","stem":"Sifat Arif yang patut diteladani adalah ....","options":["gemar menabung untuk membeli jajanan","berani mengakui kesalahan sendiri","mau bertanggung jawab atas perbuatannya"],"mcma":true,"key":"B, C","bahas":"Arif mengakui bahwa ia mengambil keripik tanpa membayar penuh (berani mengakui kesalahan) dan membayar kekurangannya (bertanggung jawab). Menabung tidak ditunjukkan dalam drama."},{"no":6,"level":"L3","tipe":"PGK Kategori","stem":"Tentukan kesesuaian tindakan berikut dengan sikap Arif di akhir drama!","mcma":false,"kategori":{"cols":["Sesuai","Tidak sesuai"],"rows":[["Murid menyobek buku perpustakaan, lalu berpura-pura tidak tahu.",1],["Murid menumpahkan minuman di buku temannya, lalu meminta maaf dan menggantinya.",0],["Murid memecahkan kaca jendela kelas saat bermain bola, lalu melapor kepada guru.",0]]},"key":"","bahas":"Di akhir drama Arif mengakui kesalahan dan menggantinya. Tindakan pada pernyataan 2 dan 3 sejalan dengan sikap itu. Pernyataan 1 justru menyembunyikan kesalahan."}]},{"no":3,"jenis":"Fiksi-Narasi","tema":"Kesabaran dan kegigihan","stimulus":[{"t":"title","text":"Sore di Lapangan Desa"},{"t":"p","text":"Dimas membawa benda buatan kakeknya ke lapangan. Rangkanya dari bambu yang disayat tipis, tubuhnya dari kertas warna merah, dan di bagian bawahnya menjuntai ekor panjang dari kain perca. Benang yang tergulung pada sebatang kayu ia genggam erat."},{"t":"p","text":"Dimas berlari sekencang-kencangnya. Namun, benda itu hanya terseret di tanah. Ia mencoba lagi dan lagi, tetapi hasilnya sama. “Percuma! Benda ini rusak,” keluhnya sambil menghentakkan kaki."},{"t":"p","text":"Kakek yang duduk di pinggir lapangan tersenyum. “Bukan bendanya yang rusak, Nak. Kita hanya perlu menunggu angin yang tepat. Rasakan arahnya, lalu lepaskan benangnya pelan-pelan.”"},{"t":"p","text":"Dimas menarik napas panjang dan berdiri diam. Ketika angin berembus dari arah barat, ia melepas benang sedikit demi sedikit. Benda itu pun melambung tinggi, bergoyang di antara awan sore. Dimas melompat gembira. Sejak saat itu, ia tidak lagi cepat kesal ketika usahanya belum berhasil."}],"soal":[{"no":7,"level":"L1","tipe":"PG","stem":"Berdasarkan kata-kata yang digunakan dalam cerita, benda yang dibawa Dimas adalah ....","options":["layang-layang","kitiran","pesawat kertas","payung kertas"],"mcma":false,"key":"A","bahas":"Kata rangka bambu, kertas, ekor, benang, angin, dan melambung tinggi mengarah pada layang-layang. Kitiran, pesawat kertas, dan payung kertas tidak memiliki benang dan ekor panjang."},{"no":8,"level":"L2","tipe":"PGK MCMA","stem":"Amanat yang sesuai dengan isi cerita adalah ....","options":["usaha yang diulang dengan sabar membuahkan hasil","benda buatan sendiri lebih baik daripada benda beli","nasihat orang berpengalaman membantu mencari jalan keluar"],"mcma":true,"key":"A, C","bahas":"Dimas berhasil setelah mencoba lagi dengan sabar dan mengikuti nasihat kakek. Pernyataan B tidak dibahas dalam cerita."},{"no":9,"level":"L2","tipe":"PG","stem":"Dimas tidak lagi mudah kesal setelah ....","options":["kakek memberinya benda yang lebih bagus","teman-temannya memuji benda buatannya","ia mengganti kertas dengan bahan lebih ringan","ia berhasil setelah mengikuti nasihat kakek"],"mcma":false,"key":"D","bahas":"Perubahan sikap Dimas terjadi setelah ia mengikuti nasihat kakek, menunggu angin yang tepat, lalu berhasil menerbangkan bendanya."}]},{"no":4,"jenis":"Fiksi-Cerpen Anak","tema":"Peduli lingkungan sekolah","stimulus":[{"t":"title","text":"Genangan di Halaman Sekolah"},{"t":"p","text":"Hujan deras baru saja reda. Raisa berdiri di depan kelas dengan wajah cemberut. Halaman sekolah berubah menjadi kolam kecil, dan sepatu putihnya telanjur basah dan kotor."},{"t":"p","text":"“Setiap hujan, air selalu menggenang di sini,” gerutunya."},{"t":"p","text":"Pak Anton, wali kelasnya, menghampiri. “Tanah di halaman ini keras dan sebagian tertutup semen, sehingga air hujan sulit meresap. Bagaimana kalau kita membuat lubang biopori?”"},{"t":"p","text":"Keesokan harinya, Raisa dan teman-temannya mengebor tanah sedalam satu meter. Mereka memasukkan daun kering dan sisa sayuran dari kantin ke dalam lubang itu. “Sampah ini akan diurai menjadi kompos oleh makhluk kecil di dalam tanah,” jelas Pak Anton. “Lubang ini juga membantu air hujan meresap lebih cepat.”"},{"t":"p","text":"Dua minggu kemudian, hujan deras turun lagi. Raisa menatap halaman dari jendela kelas. Air hujan cepat surut dan tidak ada lagi kolam kecil. Ia tersenyum lebar, lalu berlari menengok lubang-lubang kecil itu. “Ternyata lubang sekecil ini bisa menolong,” bisiknya."}],"soal":[{"no":10,"level":"L1","tipe":"PG","stem":"Apa yang dimasukkan Raisa dan teman-temannya ke dalam lubang?","options":["Batu kerikil dan pasir halus.","Daun kering dan sisa sayuran.","Potongan kayu dan ranting.","Pupuk buatan dan air."],"mcma":false,"key":"B","bahas":"Paragraf keempat menyebutkan mereka memasukkan daun kering dan sisa sayuran dari kantin ke dalam lubang."},{"no":11,"level":"L2","tipe":"PG","stem":"Perasaan Raisa ketika menengok lubang-lubang kecil itu adalah ....","options":["cemas dan gelisah","bosan dan malas","takjub dan senang","kesal dan kecewa"],"mcma":false,"key":"C","bahas":"Raisa tersenyum lebar dan berbisik bahwa lubang sekecil itu bisa menolong. Ini menunjukkan rasa takjub dan senang."},{"no":12,"level":"L3","tipe":"PGK Kategori","stem":"Tentukan benar atau salah pernyataan berikut tentang penerapan pengetahuan dari cerita di rumah!","mcma":false,"kategori":{"cols":["Benar","Salah"],"rows":[["Halaman rumah yang seluruhnya tertutup semen membuat air hujan lebih sulit meresap ke dalam tanah.",0],["Plastik bekas makanan sebaiknya dimasukkan ke lubang biopori agar cepat menjadi kompos.",1],["Sisa sayuran dari dapur dapat dimasukkan ke lubang biopori di pekarangan untuk menjadi kompos.",0]]},"key":"","bahas":"Teks menyebutkan tanah tertutup semen menyulitkan air meresap (benar) dan sampah organik seperti sisa sayuran diurai menjadi kompos (benar). Plastik bukan sampah organik sehingga tidak menjadi kompos (salah)."}]},{"no":5,"jenis":"Fiksi-Fabel","tema":"Kerendahan hati dan tolong-menolong","stimulus":[{"t":"title","text":"Ruru, Rusa yang Cepat"},{"t":"p","text":"Ruru adalah rusa muda yang paling cepat berlari di tepi hutan. Karena itu, ia sering mengejek hewan lain. “Kakimu pendek sekali, Siput! Kau baru sampai di sungai saat aku sudah selesai mandi,” ejeknya. Siput hanya tersenyum dan terus merayap."},{"t":"p","text":"Suatu pagi, Ruru berlari menembus semak-semak. Tiba-tiba, kakinya terjepit akar pohon yang menjuntai. Semakin ia meronta, semakin sakit rasanya. Hewan-hewan lain hanya lewat tanpa berani mendekat karena takut diejek."},{"t":"p","text":"Hanya Siput yang berhenti. Tanpa mengungkit ejekan itu, ia bergegas memanggil rombongan semut. Ratusan semut menggerogoti akar itu sedikit demi sedikit hingga kaki Ruru terbebas."},{"t":"p","text":"Ruru menunduk malu. “Maafkan aku, Siput. Aku sering mengejekmu, tetapi kalian justru menolongku.” Siput tersenyum. “Kita sama-sama penghuni hutan, Ruru.”"},{"t":"p","text":"Sejak hari itu, Ruru tidak lagi suka mengejek. Ia sering mengantar hewan-hewan lemah menyeberangi sungai."}],"soal":[{"no":13,"level":"L1","tipe":"PG","stem":"Apa yang dilakukan semut untuk membebaskan Ruru?","options":["Menggerogoti akar yang menjepit kakinya.","Menggali tanah di sekeliling kakinya.","Mendorong Ruru dari arah belakang.","Membawa kayu untuk mengungkit akar."],"mcma":false,"key":"A","bahas":"Paragraf ketiga menyebutkan semut menggerogoti akar sedikit demi sedikit hingga kaki Ruru terbebas."},{"no":14,"level":"L2","tipe":"PGK MCMA","stem":"Pernyataan yang menunjukkan perubahan sikap Ruru setelah peristiwa itu adalah Ruru ....","options":["meminta maaf kepada hewan yang pernah diejeknya","mengantar hewan lemah menyeberangi sungai","menghindari semak-semak agar tidak terjepit lagi"],"mcma":true,"key":"A, B","bahas":"Sebelumnya Ruru suka mengejek. Setelah ditolong, ia meminta maaf dan membantu hewan yang lemah. Pilihan C bukan perubahan sikap dan tidak disebutkan dalam teks."},{"no":15,"level":"L3","tipe":"PGK Kategori","stem":"Tentukan kesesuaian pernyataan berikut dengan perasaan kedua pembaca!","intro":[{"t":"p","text":"Setelah membaca fabel tersebut, Nadia dan Bima berbincang."},{"t":"dialog","who":"Nadia","text":"Waktu kaki Ruru terjepit, rasanya aku ingin ikut menolongnya. Untung ada Siput!"},{"t":"dialog","who":"Bima","text":"Dulu aku kesal pada Ruru karena suka mengejek. Tapi setelah ia meminta maaf, hatiku jadi hangat."}],"mcma":false,"kategori":{"cols":["Sesuai","Tidak sesuai"],"rows":[["Nadia merasa senang karena Ruru terjepit akar.",1],["Nadia merasa iba kepada Ruru.",0],["Bima merasa kesal kepada Ruru pada akhir cerita.",1]]},"key":"","bahas":"Nadia ingin menolong Ruru, berarti ia merasa iba (pernyataan 2 sesuai; 1 tidak s function blocks(list) {
  return list.map((b) => {
    if (b.t === "title") return h("h2", {}, b.text);
    if (b.t === "p") return h("p", {}, b.text);
    if (b.t === "note") return h("p", { class: "note" }, b.text);
    if (b.t === "center") return h("p", { class: "ctr" }, b.text);
    if (b.t === "right") return h("p", { class: "rt" }, b.text);
    if (b.t === "line") return h("p", { class: "ln" }, b.text);
    if (b.t === "gap") return h("div", { class: "gap" });
    if (b.t === "num") return h("p", { class: "num" }, b.n + " " + b.text);
    if (b.t === "dialog") return h("p", { class: "dlg" }, h("b", {}, b.who), ": " + b.text);
    if (b.t === "img") return h("figure", { class: "img" }, h("b", {}, b.label), h("img", { src: IMAGES[b.label], alt: b.spec, loading: "lazy" }), h("figcaption", {}, b.spec));
  });
}
